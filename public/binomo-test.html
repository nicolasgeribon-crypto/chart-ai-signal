<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba Binomo · solo lectura</title>
<style>
body{font-family:system-ui;background:#0d0f14;color:#f5f5f7;margin:0;padding:32px 22px}main{max-width:760px;margin:auto}h1{font-size:38px;margin:20px 0 10px}.muted{color:#a9abb3;font-size:19px;line-height:1.45}.card{background:#171a21;border:1px solid #30343f;border-radius:22px;padding:24px;margin-top:24px}.ok{color:#54df8a}.bad{color:#ff7575}button{width:100%;border:0;border-radius:18px;padding:20px;font-size:22px;font-weight:800;background:#7b35f2;color:white;margin-top:22px}pre{white-space:pre-wrap;word-break:break-word;background:#090b0f;border-radius:18px;padding:20px;font-size:15px;line-height:1.45;overflow:auto}
</style></head>
<body><main><h1>Prueba Binomo</h1><p class="muted">Diagnóstico de solo lectura. No compra, no vende y no modifica la cuenta.</p><div id="status" class="card">Comprobando configuración…</div><button id="go">Probar conexión</button><div class="card"><h2>Resultado</h2><pre id="out">Aún no probado.</pre></div></main>
<script>
const status=document.getElementById('status'),out=document.getElementById('out'),go=document.getElementById('go');
async function init(){try{const r=await fetch('/api/binomo/status');const j=await r.json();status.innerHTML=j.configured?'<span class="ok">✓ BINOMO_EMAIL y BINOMO_PASSWORD configurados en Render</span>':'<span class="bad">✕ Faltan BINOMO_EMAIL y BINOMO_PASSWORD en Render</span>'}catch{status.textContent='No se pudo consultar el estado.'}}
go.onclick=async()=>{go.disabled=true;go.textContent='Probando…';out.textContent='Conectando con Binomo…';try{const r=await fetch('/api/binomo/diagnose',{method:'POST'});const j=await r.json();out.textContent=JSON.stringify(j,null,2)}catch(e){out.textContent='Error de red: '+e.message}finally{go.disabled=false;go.textContent='Probar nuevamente'}};init();
</script></body></html>
